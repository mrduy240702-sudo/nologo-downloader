name: Validate NoLogo
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/douyin-slides-v5-2, release/v6.0-stable, feature/quick-paste-clear-v6-1, feature/video-quality-ios-zoom-v6-2]
jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py
      - run: python -m unittest discover -s tests -v